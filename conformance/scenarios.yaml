schemaVersion: "0.1"
kind: conformance-scenarios
cases:
  - id: host-lifecycle
    observes:
      - process start and stop
      - one native window
      - no orphan selected sidecars
  - id: selected-ui-runtime
    observes:
      - exactly one UI runtime is present
      - foreign UI runtimes are absent
  - id: workspace-revision-write
    observes:
      - safe path enforcement
      - write rejected on revision mismatch
  - id: agent-event-stream
    observes:
      - closed event set
      - abort
      - opaque runtime
  - id: browse-session-dispose
    observes:
      - isolated storage
      - view disposal
  - id: portable-delivery
    observes:
      - reproducible on-disk layout
      - portable state beside the executable when selected
  - id: vertical-slice-removal
    observes:
      - owned files gone
      - owned dependencies gone
      - physical absence of the dropped surface
      - user-modified former outputs produce a conflict
  - id: compatibility-selection
    observes:
      - selected adapters satisfy declared contract ranges
      - required compatibility terms are provided by selected records
      - forbidden compatibility terms are physically absent
      - conflicting exact dependency versions fail before materialization
  - id: lock-replay
    observes:
      - persisted lock binds semantic manifest and registry snapshot digests
      - persisted lock binds the materialization plan digest
      - verification does not execute external validators when lock replay fails
