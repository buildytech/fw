      require: v0.0.0
      replace: local
    notes: Staged from ide/.modules/languages. No owned language files.
    conformanceRefs:
      - language-document-operations
  - id: terminal-host-go
    kind: adapter
    version: 0.0.0-draft
    contract: terminal@0
    provides:
      - terminal
    readiness: draft
    source:
      kind: git
      repository: https://github.com/buildytech/ide.git
      commit: 85082e7c93742ff0e5fed8ff9151bc4a1f4c552c
      subpath: .modules/terminal
      module: github.com/fastygo/modules/terminal
      portable: true
    go:
      module: github.com/fastygo/modules/terminal
      require: v0.0.0
      replace: local
    notes: Staged from ide/.modules/terminal. Memory on non-Windows. ConPTY on Windows.
    conformanceRefs:
      - terminal-session-lifecycle
  - id: userstore-local-go
    kind: adapter
    version: 0.0.0-draft
    contract: userstore@0
    provides:
