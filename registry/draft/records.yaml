      require: v0.0.0
      replace: local
    notes: package.json scripts and go.mod commands. Not a port.
  - id: ui-ui8kit-templ
    kind: adapter
    version: 0.0.0-draft
    contract: ui@0
    provides:
      - ui
      - templ
    readiness: draft
    source:
      kind: generated
      path: ../artifacts/ui-ui8kit-templ
      portable: false
    compatibility:
      runtimes:
        - templ
    ownedFiles:
      - ui/runtime.txt
      - frontend/dist/index.html
      - frontend/app.templ
    integrity:
      publicDigest: sha256:draft-ui-templ
    conformanceRefs:
      - selected-ui-runtime
    dependencies:
      - ui8kit-codegen
  - id: ui-ui8kit-svelte
    kind: adapter
    version: 0.0.0-draft
    contract: ui@0
    provides:
      - ui
      - svelte
    features:
      - svelte5
    readiness: draft
    source:
      kind: generated
      path: ../artifacts/ui-ui8kit-svelte
      portable: false
    compatibility:
      runtimes:
        - svelte
    ownedFiles:
      - ui/runtime.txt
      - frontend/dist/index.html
      - frontend/src/App.svelte
    npm:
      dependencies:
        svelte: 5.0.0
    integrity:
      publicDigest: sha256:draft-ui-svelte
    conformanceRefs:
      - selected-ui-runtime
    dependencies:
      - ui8kit-codegen
  - id: ui-ui8kit-solid
    kind: adapter
    version: 0.0.0-draft
    contract: ui@0
    provides:
      - ui
      - solid-js
    readiness: draft
    source:
      kind: npm
      package: "@ui8kit/registry"
      ref: 2.0.0
    compatibility:
      runtimes:
        - solid
    npm:
      dependencies:
        solid-js: 1.9.0
    integrity:
      publicDigest: sha256:draft-ui-solid
    conformanceRefs:
      - selected-ui-runtime
    notes: Bricks install via ui8kit add from @ui8kit/registry. Not a fwyml file warehouse.
  - id: editor-templ
    kind: adapter
    version: 0.0.0-draft
    contract: editor@0
    provides:
      - editor
    readiness: draft
    source:
      kind: local
      path: ../artifacts/editor-templ
      portable: false
    ownedFiles:
      - editor/surface.txt
      - compose/editor.go
    notes: Limited textarea document adapter. Does not claim richer editor parity.
    integrity:
      publicDigest: sha256:draft-editor-templ
    conformanceRefs:
      - editor-document-lifetime
  - id: editor-editory-svelte
    kind: adapter
    version: 0.0.0-draft
