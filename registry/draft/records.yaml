    readiness: draft
    source:
      kind: git
      repository: https://github.com/buildytech/ide.git
      commit: 85082e7c93742ff0e5fed8ff9151bc4a1f4c552c
      subpath: .modules/userstore
      module: github.com/fastygo/modules/userstore
      portable: true
    go:
      module: github.com/fastygo/modules/userstore
      require: v0.0.0
      replace: local
    notes: Staged from ide/.modules/userstore. No owned store files.
    conformanceRefs:
      - userstore-local
  - id: editor-buffer-go
    kind: adapter
    version: 0.0.0-draft
    contract: editor@0
    provides:
      - editor
    readiness: draft
    source:
      kind: git
      repository: https://github.com/buildytech/ide.git
      commit: 85082e7c93742ff0e5fed8ff9151bc4a1f4c552c
      subpath: .modules/editor
      module: github.com/fastygo/modules/editor
      portable: true
    go:
