schemaVersion: fw.buildy.tech/registry/v0alpha1
kind: Registry
metadata:
  id: vsa-draft-records
  status: draft
records:
  - id: host
    kind: capability
    version: "0"
    contract: host@0
    readiness: draft
    conformanceRefs:
      - host-lifecycle
  - id: desktop-presentation
    kind: capability
    version: "0"
    contract: desktop-presentation@0
    readiness: draft
    conformanceRefs:
      - desktop-presentation-boundary
  - id: ui
    kind: capability
    version: "0"
    contract: ui@0
    readiness: draft
    conformanceRefs:
      - selected-ui-runtime
  - id: workspace
    kind: capability
    version: "0"
    contract: workspace@0
    readiness: draft
    conformanceRefs:
      - workspace-revision-write
  - id: editor
    kind: capability
    version: "0"
    contract: editor@0
    readiness: draft
    conformanceRefs:
      - editor-document-lifetime
  - id: explorer
    kind: capability
    version: "0"
    contract: explorer@0
    readiness: draft
    conformanceRefs:
      - explorer-open-intent
  - id: vcs
    kind: capability
    version: "0"
    contract: vcs@0
    readiness: draft
    conformanceRefs:
      - vcs-status-and-failures
  - id: agent
    kind: capability
    version: "0"
    contract: agent@0
    readiness: draft
    conformanceRefs:
      - agent-event-stream
  - id: browse
    kind: capability
    version: "0"
    contract: browse@0
    readiness: draft
    conformanceRefs:
      - browse-session-dispose
  - id: delivery
    kind: capability
    version: "0"
    contract: delivery@0
    readiness: draft
    conformanceRefs:
      - portable-delivery
  - id: languages
    kind: capability
    version: "0"
    contract: languages@0
    readiness: draft
    conformanceRefs:
      - language-document-operations
  - id: terminal
    kind: capability
    version: "0"
    contract: terminal@0
    readiness: draft
    conformanceRefs:
      - terminal-session-lifecycle
  - id: templ
    kind: capability
    version: "0"
    contract: ui@0
    readiness: draft
  - id: svelte
    kind: capability
    version: "0"
    contract: ui@0
    readiness: draft
  - id: solid-js
    kind: capability
    version: "0"
    contract: ui@0
    readiness: draft
  - id: desktop-presentation-go
    kind: adapter
    version: 0.0.0-draft
    contract: desktop-presentation@0
    provides:
      - desktop-presentation
    requires:
      - workspace
      - userstore
      - terminal
      - vcs
      - languages
    readiness: draft
    source:
      kind: git
      repository: https://github.com/buildytech/ide.git
      commit: 85082e7c93742ff0e5fed8ff9151bc4a1f4c552c
      subpath: .modules/desktop
      module: github.com/fastygo/modules/desktop
      portable: true
    go:
      module: github.com/fastygo/modules/desktop
      require: v0.0.0
      replace: local
    notes: Staged from ide/.modules/desktop. Transport-neutral BFF. No owned compose files.
    conformanceRefs:
      - desktop-presentation-boundary
  - id: host-wails3-go
    kind: adapter
    version: 0.0.0-draft
    contract: host@0
    provides:
      - host
    features:
      - wails3
    requires:
      - desktop-presentation
    dependencies:
      - desktop-presentation-go
    readiness: draft
    source:
      kind: git
      repository: https://github.com/buildytech/ide.git
      commit: 85082e7c93742ff0e5fed8ff9151bc4a1f4c552c
      subpath: .modules/wails
      module: github.com/fastygo/modules/wails
      portable: true
    go:
      module: github.com/fastygo/modules/wails
      require: v0.0.0
      replace: local
    notes: Staged from ide/.modules/wails. Wails adapter of desktop.Host. No artifact file copies.
    compatibility:
      platforms:
        - windows
      runtimes:
        - go
    conformanceRefs:
      - host-lifecycle
  - id: delivery-portable-windows
    kind: delivery
    version: 0.0.0-draft
    contract: delivery@0
    provides:
      - delivery
    readiness: draft
    source:
      kind: git
      repository: https://github.com/buildytech/ide.git
      commit: 85082e7c93742ff0e5fed8ff9151bc4a1f4c552c
      subpath: .modules/portable
      module: github.com/fastygo/modules/portable
      portable: true
    go:
      module: github.com/fastygo/modules/portable
      require: v0.0.0
      replace: local
    notes: Staged from ide/.modules/portable. No owned path files.
    conformanceRefs:
      - portable-delivery
    compatibility:
      platforms:
        - windows
  - id: process-go
    kind: adapter
    version: 0.0.0-draft
    readiness: draft
    source:
      kind: git
      repository: https://github.com/buildytech/ide.git
      commit: 85082e7c93742ff0e5fed8ff9151bc4a1f4c552c
      subpath: .modules/process
      module: github.com/fastygo/modules/process
      portable: true
    go:
      module: github.com/fastygo/modules/process
      require: v0.0.0
      replace: local
    notes: Shared spawn helpers. Not a port.
  - id: workspace-fs-go
    kind: adapter
    version: 0.0.0-draft
    contract: workspace@0
    provides:
      - workspace
    readiness: draft
    source:
      kind: git
      repository: https://github.com/buildytech/ide.git
      commit: 85082e7c93742ff0e5fed8ff9151bc4a1f4c552c
      subpath: .modules/workspace
      module: github.com/fastygo/modules/workspace
      portable: true
    go:
      module: github.com/fastygo/modules/workspace
      require: v0.0.0
      replace: local
    notes: Staged from ide/.modules/workspace. Product imports the module. No file copy.
    conformanceRefs:
      - workspace-revision-write
  - id: explorer-workspace-tree
    kind: adapter
    version: 0.0.0-draft
    contract: explorer@0
    provides:
      - explorer
    requires:
      - workspace
    readiness: draft
    source:
      kind: none
    integrity:
      publicDigest: sha256:draft-explorer
    conformanceRefs:
      - explorer-open-intent
    notes: Explorer UI is a ui8kit widget. Workspace.ListTree stays in the workspace module. No compose file copy.
  - id: vcs-git-cli
    kind: adapter
    version: 0.0.0-draft
    contract: vcs@0
    provides:
      - vcs
    requires:
      - workspace
    dependencies:
      - process-go
    readiness: draft
    source:
      kind: git
      repository: https://github.com/buildytech/ide.git
      commit: 85082e7c93742ff0e5fed8ff9151bc4a1f4c552c
      subpath: .modules/vcs
      module: github.com/fastygo/modules/vcs
      portable: true
    go:
      module: github.com/fastygo/modules/vcs
      require: v0.0.0
      replace: local
    notes: Staged from ide/.modules/vcs. No owned git CLI files.
    integrity:
      publicDigest: sha256:draft-vcs
    conformanceRefs:
      - vcs-status-and-failures
  - id: languages-workspace-go
