schemaVersion: urn:fwyml:registry:v0alpha1
kind: Registry
metadata:
  id: fw-port-records
  status: draft
records:
  - id: host
    kind: capability
    version: "0"
    contract: host@0
    readiness: draft
    conformanceRefs:
      - host-lifecycle
  - id: ui
    kind: capability
    version: "0"
    contract: ui@0
    readiness: draft
    conformanceRefs:
      - selected-ui-runtime
  - id: workspace
    kind: capability
    version: "0"
    contract: workspace@0
    readiness: draft
    conformanceRefs:
      - workspace-revision-write
  - id: vcs
    kind: capability
    version: "0"
    contract: vcs@0
    readiness: draft
    conformanceRefs:
      - vcs-status-and-failures
  - id: agent
    kind: capability
    version: "0"
    contract: agent@0
    readiness: draft
    conformanceRefs:
      - agent-event-stream
  - id: delivery
    kind: capability
    version: "0"
    contract: delivery@0
    readiness: draft
    conformanceRefs:
      - portable-delivery
