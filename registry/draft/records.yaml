  - id: tasks-discover-go
    kind: adapter
    version: 0.0.0-draft
    readiness: draft
    source:
      kind: git
      repository: https://github.com/buildytech/ide.git
      commit: 85082e7c93742ff0e5fed8ff9151bc4a1f4c552c
      subpath: .modules/tasks
